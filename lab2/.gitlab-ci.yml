# Каркас пайплайна для lab2 — три обязательных стейджа.
#
# Этот файл уезжает в локальный GitLab через `git subtree push --prefix=lab2 gitlab main`,
# поэтому в проекте lab2-mlops он окажется в КОРНЕ репозитория (а не в подпапке lab2/).
# Из-за этого все пути ниже — короткие: data/, models/, logs/ — без префикса lab2/.
#
# script: блоки оставлены пустыми намеренно — заполните их вызовами своих скриптов.

stages:
  - prepare-dataset
  - train
  - test

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r requirements.txt

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip-$CI_COMMIT_REF_SLUG
  paths:
    - .cache/pip

prepare-dataset:
  stage: prepare-dataset
  script:
    # TODO: запустите свои скрипты сбора и предобработки данных,
    #       результат должен оказаться в папке data/
    - echo "TODO: replace with your data collection / preprocessing commands"
    - exit 1
  artifacts:
    paths:
      - data/
    expire_in: 1 week

train:
  stage: train
  needs:
    - prepare-dataset
  script:
    # TODO: запустите обучение модели, сериализованная модель должна попасть в models/
    - echo "TODO: replace with your training command"
    - exit 1
  artifacts:
    paths:
      - models/
    expire_in: 1 week

test:
  stage: test
  needs:
    - prepare-dataset
    - train
  script:
    # TODO: прогоните модель на тестовых данных, метрики/отчёт сохраните в logs/
    - echo "TODO: replace with your testing command"
    - exit 1
  artifacts:
    paths:
      - logs/
    expire_in: 1 week
